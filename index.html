<title>TV Player — Kantor</title>
<style>
  :root{
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #262b33;
    --text: #e9edf2;
    --muted: #8b93a1;
    --accent: #ff7a3d;
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family: 'Segoe UI', -apple-system, sans-serif;
    overflow:hidden;
  }
  #player{ position:fixed; inset:0; background:#000; display:none; }
  #player.active{display:block;}
  #player .tag{
    position:absolute; bottom:14px; right:18px;
    font-family:var(--mono); font-size:12px; color:rgba(255,255,255,.35);
    letter-spacing:.05em; pointer-events:none;
  }
